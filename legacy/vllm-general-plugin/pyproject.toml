[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bidkv-vllm-legacy"
version = "0.1.1"
description = "Archived vLLM general-plugin bootstrap for BidKV experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["bidkv==0.1.1"]

[project.entry-points."vllm.general_plugins"]
bidkv = "bidkv.adapters.vllm.plugin:register"

[tool.setuptools.packages.find]
where = ["src"]
